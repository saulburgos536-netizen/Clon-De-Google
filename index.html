<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - Saúl Burgos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="nav-header">
            <a href="#">Gmail</a>
            <a href="#">Imágenes</a>
            <a href="#" class="icono-puntos">⋮⋮⋮</a>
            <button class="btn-perfil">S</button>
        </nav>
    </header>

    <main>
        <section class="seccion-logo">
            <h1 class="logo">
                <span class="azul">G</span><span class="rojo">o</span><span class="amarillo">o</span><span class="azul">g</span><span class="verde">l</span><span class="rojo">e</span>
            </h1>
        </section>

        <section class="seccion-buscador">
            <div class="buscador">
                <span>🔍</span>
                <input type="text" placeholder="Buscar en Google o escribir una URL">
                <span>🎤</span>
                <span>📷</span>
            </div>
        </section>

        <section class="seccion-botones">
            <button>Buscar con Google</button>
            <button>Voy a tener suerte</button>
        </section>

        <p id="texto-idioma">Ofrecido por Google en: <a href="#">Español (Latinoamérica)</a></p>
    </main>

    <footer>
        <div class="pais">
            <p>Ecuador</p>
        </div>
        <div class="links-footer">
            <div class="izquierda">
                <a href="#">Sobre Google</a>
                <a href="#">Publicidad</a>
                <a href="#">Negocios</a>
                <a href="#">Cómo funciona la Búsqueda</a>
            </div>
            <div class="derecha">
                <a href="#">Privacidad</a>
                <a href="#">Condiciones</a>
                <a href="#">Preferencias</a>
            </div>
        </div>
    </footer>
</body>
</html>
